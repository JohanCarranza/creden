<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>TIU Virtual Demo</title>

<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}

html,
body{
  width:100%;
  height:100%;
  overflow:hidden;
}

body{
  font-family:'Inter',sans-serif;
  background:#dfe5fb;
}

.phone{
  width:min(100vw,430px);
  height:100dvh;
  margin:0 auto;
  position:relative;
  overflow:hidden;
  background-color:#f7f9ff;
  background-image:url("fondo-tiu.svg");
  background-repeat:no-repeat;
  background-size:cover;
  background-position:center calc(100% - clamp(76px,12vh,112px));
  padding:calc(16px + env(safe-area-inset-top)) 18px calc(10px + env(safe-area-inset-bottom));
  display:flex;
  flex-direction:column;
  align-items:center;
}

.header{
  width:100%;
  display:flex;
  align-items:center;
  gap:19px;
  position:relative;
  z-index:7;
  flex:0 0 auto;
}

.back{
  width:38px;
  height:38px;
  border-radius:50%;
  background:white;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#ff1f2b;
  font-size:0;
  box-shadow:0 5px 16px rgba(39,51,91,.08);
}

.back::before{
  content:"";
  width:11px;
  height:11px;
  border-left:5px solid #ff1f2b;
  border-bottom:5px solid #ff1f2b;
  transform:rotate(45deg);
  margin-left:5px;
  border-radius:2px;
}

.title{
  font-family:'Oswald',sans-serif;
  font-size:29px;
  font-weight:700;
  letter-spacing:0;
  line-height:1;
  color:#111318;
}

.clock{
  width:max-content;
  margin-top:clamp(46px,8.4vh,78px);
  padding:10px clamp(31px,9vw,39px) 12px;
  border-radius:12px;
  background:#d8d3ff;
  color:#05060a;
  font-size:clamp(39px,11.5vw,52px);
  font-weight:400;
  line-height:1;
  letter-spacing:0;
  position:relative;
  z-index:7;
  white-space:nowrap;
}

.date{
  margin-top:clamp(14px,2.7vh,22px);
  text-align:center;
  font-size:clamp(17px,4.4vw,21px);
  font-weight:400;
  line-height:1.2;
  color:#46566a;
  position:relative;
  z-index:7;
}

.photo{
  width:clamp(108px,32vw,140px);
  height:clamp(108px,32vw,140px);
  margin-top:clamp(40px,7.8vh,70px);
  border-radius:50%;
  overflow:hidden;
  background:#e3e2ea;
  position:relative;
  z-index:7;
  flex:0 0 auto;
}

.photo img{
  width:100%;
  height:100%;
  object-fit:cover;
}

/* NUBES */
.cloud{
  position:absolute;
  width:140px;
  height:45px;
  z-index:3;
  opacity:.72;
  animation:moveClouds linear infinite;
}

.cloud::before{
  content:"";
  position:absolute;
  bottom:0;
  width:140px;
  height:24px;
  background:#c2caff;
  border-radius:40px;
}

.cloud::after{
  content:"";
  position:absolute;
  bottom:8px;
  left:42px;
  width:66px;
  height:54px;
  background:#c2caff;
  border-radius:50%;
  box-shadow:
    -45px 17px 0 -12px #c2caff,
    48px 15px 0 -14px #c2caff;
}

.cloud.one{top:45%;transform:scale(.48);animation-duration:20s}
.cloud.two{top:52%;transform:scale(.68);animation-duration:25s;animation-delay:-9s}
.cloud.three{top:49%;transform:scale(.38);animation-duration:28s;animation-delay:-16s}

@keyframes moveClouds{
  from{left:110%}
  to{left:-220px}
}

.card{
  width:100%;
  margin:auto 0 0;
  background:rgba(255,255,255,.94);
  border-radius:15px;
  padding:clamp(21px,3.5vh,30px) 16px clamp(20px,3.5vh,30px);
  text-align:center;
  position:relative;
  z-index:6;
  box-shadow:0 8px 24px rgba(42,49,85,.06);
  overflow:hidden;
  flex:0 0 auto;
}

.demo{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:52px;
  font-weight:900;
  color:rgba(255,0,0,.035);
  transform:rotate(-20deg);
  pointer-events:none;
}

.name{
  font-family:'Oswald',sans-serif;
  font-size:clamp(31px,8.7vw,39px);
  line-height:1;
  font-weight:700;
  letter-spacing:1.5px;
  color:#ff3f46;
  text-transform:uppercase;
  overflow-wrap:anywhere;
}

.label{
  margin-top:clamp(10px,1.8vh,15px);
  font-size:clamp(14px,3.9vw,18px);
  line-height:1.1;
  font-weight:400;
  color:#111318;
}

.value{
  margin-top:2px;
  font-size:clamp(17px,4.8vw,22px);
  line-height:1.05;
  font-weight:800;
  color:#465266;
}

.career{
  margin-top:clamp(17px,2.7vh,26px);
  font-size:clamp(17px,4.8vw,22px);
  line-height:1.12;
  font-weight:800;
  color:#465266;
}

.campus{
  margin-top:clamp(12px,2vh,18px);
  font-size:clamp(15px,4.2vw,19px);
  line-height:1.15;
  font-weight:400;
  color:#16191f;
}

.pin{
  color:#e53c43;
  margin-right:9px;
}

@media(max-height:760px){
  .phone{background-position:center calc(100% - 84px)}
  .clock{margin-top:clamp(34px,6.3vh,52px)}
  .date{margin-top:13px}
  .photo{margin-top:clamp(30px,6vh,46px);width:106px;height:106px}
  .card{padding:19px 15px 20px}
  .label{margin-top:10px}
  .career{margin-top:17px}
  .campus{margin-top:12px}
}

@media(max-height:650px){
  .phone{padding-top:10px;background-position:center calc(100% - 68px)}
  .header{gap:15px}
  .back{width:34px;height:34px}
  .title{font-size:25px}
  .clock{margin-top:22px;font-size:34px;padding:8px 28px;border-radius:11px}
  .date{margin-top:10px;font-size:15px}
  .photo{margin-top:22px;width:82px;height:82px}
  .card{padding:14px 12px 15px;border-radius:14px}
  .name{font-size:25px;letter-spacing:1px}
  .label{font-size:13px;margin-top:7px}
  .value{font-size:16px}
  .career{font-size:14px;margin-top:11px}
  .campus{font-size:13px;margin-top:8px}
}
</style>
</head>

<body>

<div class="phone">

  <div class="header">
    <div class="back" aria-hidden="true"></div>
    <div class="title">TIU VIRTUAL</div>
  </div>

  <div class="clock" id="clock">00:00:00</div>
  <div class="date" id="date">Lunes, 01 Jun 2026</div>

  <div class="photo">
    <img id="studentPhoto" src="eduardo.png" alt="Foto de Eduardo">
  </div>

  <div class="cloud one"></div>
  <div class="cloud two"></div>
  <div class="cloud three"></div>

  <div class="card">
    <div class="demo"></div>

    <div class="name" id="displayName"></div>

    <div class="label">Código de alumno:</div>
    <div class="value" id="studentCode"></div>

    <div class="label">ID Banner:</div>
    <div class="value" id="bannerId"></div>

    <div class="career">ADM. Y GERENCIA DEL EMPREND.</div>
    <div class="campus"><span class="pin">📍</span>Campus San Miguel</div>
  </div>

</div>

<script>
const alumno = {
  nombres:"Eduardo Antonio",
  apellidoPaterno:"Marcos",
  apellidoMaterno:"Serquen",
  codigo:"U202110440",
  banner:"N00981710",
  foto:"eduardo.png"
};

function ocultarApellido(apellido){
  return apellido.charAt(0).toUpperCase() + "***";
}

function cargarDatos(){
  document.getElementById("displayName").innerText =
    `${alumno.nombres} ${ocultarApellido(alumno.apellidoPaterno)} ${ocultarApellido(alumno.apellidoMaterno)}`;

  document.getElementById("studentCode").innerText = alumno.codigo;
  document.getElementById("bannerId").innerText = alumno.banner;
  document.getElementById("studentPhoto").src = alumno.foto;
}

function actualizarHora(){
  const ahora = new Date();

  const hora = new Intl.DateTimeFormat("es-PE", {
    timeZone:"America/Lima",
    hour:"2-digit",
    minute:"2-digit",
    second:"2-digit",
    hour12:false
  }).format(ahora);

  const fecha = new Intl.DateTimeFormat("es-PE", {
    timeZone:"America/Lima",
    weekday:"long",
    day:"2-digit",
    month:"short",
    year:"numeric"
  }).format(ahora);

  document.getElementById("clock").innerText = hora;
  document.getElementById("date").innerText =
    fecha.charAt(0).toUpperCase() + fecha.slice(1);
}

cargarDatos();
actualizarHora();
setInterval(actualizarHora,1000);
</script>

</body>
</html>
