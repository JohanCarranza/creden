<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>TIU Virtual Demo</title>

<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}

html,
body{
  width:100%;
  height:100%;
  overflow:hidden;
}

body{
  font-family:'Inter',sans-serif;
  background:#dfe5fb;
}

.phone{
  width:min(100vw,430px);
  height:100dvh;
  margin:0 auto;
  position:relative;
  overflow:hidden;
  background-color:#f7f9ff;
  background-image:url("fondo-tiu.svg");
  background-repeat:no-repeat;
  background-size:cover;
  background-position:center calc(100% - clamp(64px,10vh,96px));
  padding:calc(16px + env(safe-area-inset-top)) 18px calc(12px + env(safe-area-inset-bottom));
  display:flex;
  flex-direction:column;
  align-items:center;
}

.header{
  width:100%;
  display:flex;
  align-items:center;
  gap:18px;
  position:relative;
  z-index:7;
  flex:0 0 auto;
}

.back{
  width:36px;
  height:36px;
  border-radius:50%;
  background:white;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#ff1f2b;
  font-size:0;
  box-shadow:0 5px 16px rgba(39,51,91,.08);
}

.back::before{
  content:"";
  width:10px;
  height:10px;
  border-left:4px solid #ff1f2b;
  border-bottom:4px solid #ff1f2b;
  transform:rotate(45deg);
  margin-left:4px;
  border-radius:2px;
}

.title{
  font-family:'Oswald',sans-serif;
  font-size:27px;
  font-weight:700;
  letter-spacing:0;
  line-height:1;
  color:#111318;
}

.clock{
  width:max-content;
  margin-top:clamp(44px,8vh,72px);
  padding:10px clamp(31px,9vw,39px) 12px;
  border-radius:12px;
  background:#d8d3ff;
  color:#05060a;
  font-size:clamp(39px,11.5vw,52px);
  font-weight:400;
  line-height:1;
  letter-spacing:0;
  position:relative;
  z-index:7;
  white-space:nowrap;
}

.date{
  margin-top:clamp(13px,2.5vh,20px);
  text-align:center;
  font-size:clamp(16px,4.1vw,20px);
  font-weight:400;
  line-height:1.2;
  color:#46566a;
  position:relative;
  z-index:7;
}

.photo{
  width:clamp(106px,31vw,136px);
  height:clamp(106px,31vw,136px);
  margin-top:clamp(35px,7vh,62px);
  border-radius:50%;
  overflow:hidden;
  background:#e3e2ea;
  position:relative;
  z-index:7;
  flex:0 0 auto;
}

.photo img{
  width:100%;
  height:100%;
  object-fit:cover;
}

/* NUBES */
.cloud{
  position:absolute;
  width:140px;
  height:45px;
  z-index:3;
  opacity:.72;
  animation:moveClouds linear infinite;
}

.cloud::before{
  content:"";
  position:absolute;
  bottom:0;
  width:140px;
  height:24px;
  background:#c2caff;
  border-radius:40px;
}

.cloud::after{
  content:"";
  position:absolute;
  bottom:8px;
  left:42px;
  width:66px;
  height:54px;
  background:#c2caff;
  border-radius:50%;
  box-shadow:
    -45px 17px 0 -12px #c2caff,
    48px 15px 0 -14px #c2caff;
}

.cloud.one{top:39%;transform:scale(.45);animation-duration:12s}
.cloud.two{top:45%;transform:scale(.63);animation-duration:14s;animation-delay:-6s}
.cloud.three{top:47%;transform:scale(.35);animation-duration:13s;animation-delay:-10s}

@keyframes moveClouds{
  from{left:110%}
  to{left:-220px}
}

.card{
  width:min(94%,394px);
  margin:auto 0 0;
  background:rgba(255,255,255,.95);
  border-radius:13px;
  padding:clamp(16px,2.8vh,23px) 14px clamp(16px,2.8vh,24px);
  text-align:center;
  position:relative;
  z-index:6;
  box-shadow:0 7px 20px rgba(42,49,85,.055);
  overflow:hidden;
  flex:0 0 auto;
}

.demo{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:52px;
  font-weight:900;
  color:rgba(255,0,0,.03);
  transform:rotate(-20deg);
  pointer-events:none;
}

.name{
  font-family:'Oswald',sans-serif;
  font-size:clamp(28px,7.7vw,35px);
  line-height:1;
  font-weight:600;
  letter-spacing:1.2px;
  color:#ff3f46;
  text-transform:uppercase;
  overflow-wrap:anywhere;
}

.label{
  margin-top:clamp(8px,1.45vh,12px);
  font-size:clamp(13px,3.5vw,16px);
  line-height:1.08;
  font-weight:400;
  color:#111318;
}

.value{
  margin-top:1px;
  font-size:clamp(15px,4.1vw,19px);
  line-height:1.05;
  font-weight:700;
  color:#465266;
}

.career{
  margin-top:clamp(13px,2.1vh,20px);
  font-size:clamp(15px,4.1vw,19px);
  line-height:1.1;
  font-weight:700;
  color:#465266;
}

.campus{
  margin-top:clamp(9px,1.6vh,14px);
  font-size:clamp(13px,3.6vw,16px);
  line-height:1.12;
  font-weight:400;
  color:#16191f;
}

.pin{
  color:#e53c43;
  margin-right:8px;
}

@media(max-height:760px){
  .phone{background-position:center calc(100% - 72px)}
  .clock{margin-top:clamp(32px,5.9vh,48px)}
  .date{margin-top:12px}
  .photo{margin-top:clamp(27px,5.4vh,42px);width:102px;height:102px}
  .cloud.one{top:38%}
  .cloud.two{top:44%}
  .cloud.three{top:46%}
  .card{width:92%;padding:15px 13px 16px}
  .label{margin-top:7px}
  .career{margin-top:13px}
  .campus{margin-top:9px}
}

@media(max-height:650px){
  .phone{padding-top:10px;background-position:center calc(100% - 58px)}
  .header{gap:14px}
  .back{width:32px;height:32px}
  .title{font-size:24px}
  .clock{margin-top:20px;font-size:33px;padding:8px 27px;border-radius:11px}
  .date{margin-top:9px;font-size:14px}
  .photo{margin-top:19px;width:78px;height:78px}
  .cloud.one{top:36%;animation-duration:10s}
  .cloud.two{top:42%;animation-duration:11s}
  .cloud.three{top:44%;animation-duration:10s}
  .card{width:92%;padding:12px 11px 13px;border-radius:12px}
  .name{font-size:23px;letter-spacing:.9px;font-weight:600}
  .label{font-size:12px;margin-top:6px}
  .value{font-size:14px;font-weight:700}
  .career{font-size:13px;margin-top:10px;font-weight:700}
  .campus{font-size:12px;margin-top:7px}
}
</style>
</head>

<body>

<div class="phone">

  <div class="header">
    <div class="back" aria-hidden="true"></div>
    <div class="title">TIU VIRTUAL</div>
  </div>

  <div class="clock" id="clock">00:00:00</div>
  <div class="date" id="date">Lunes, 01 Jun 2026</div>

  <div class="photo">
    <img id="studentPhoto" src="eduardo.png" alt="Foto de Eduardo">
  </div>

  <div class="cloud one"></div>
  <div class="cloud two"></div>
  <div class="cloud three"></div>

  <div class="card">
    <div class="demo"></div>

    <div class="name" id="displayName"></div>

    <div class="label">Código de alumno:</div>
    <div class="value" id="studentCode"></div>

    <div class="label">ID Banner:</div>
    <div class="value" id="bannerId"></div>

    <div class="career">ADM. Y GERENCIA DEL EMPREND.</div>
    <div class="campus"><span class="pin">📍</span>Campus San Miguel</div>
  </div>

</div>

<script>
const alumno = {
  nombres:"Eduardo Antonio",
  apellidoPaterno:"Marcos",
  apellidoMaterno:"Serquen",
  codigo:"U202110440",
  banner:"N00981710",
  foto:"eduardo.png"
};

function ocultarApellido(apellido){
  return apellido.charAt(0).toUpperCase() + "***";
}

function cargarDatos(){
  document.getElementById("displayName").innerText =
    `${alumno.nombres} ${ocultarApellido(alumno.apellidoPaterno)} ${ocultarApellido(alumno.apellidoMaterno)}`;

  document.getElementById("studentCode").innerText = alumno.codigo;
  document.getElementById("bannerId").innerText = alumno.banner;
  document.getElementById("studentPhoto").src = alumno.foto;
}

function actualizarHora(){
  const ahora = new Date();

  const hora = new Intl.DateTimeFormat("es-PE", {
    timeZone:"America/Lima",
    hour:"2-digit",
    minute:"2-digit",
    second:"2-digit",
    hour12:false
  }).format(ahora);

  const fecha = new Intl.DateTimeFormat("es-PE", {
    timeZone:"America/Lima",
    weekday:"long",
    day:"2-digit",
    month:"short",
    year:"numeric"
  }).format(ahora);

  document.getElementById("clock").innerText = hora;
  document.getElementById("date").innerText =
    fecha.charAt(0).toUpperCase() + fecha.slice(1);
}

cargarDatos();
actualizarHora();
setInterval(actualizarHora,1000);
</script>

</body>
</html>
