<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>TIU Virtual Demo</title>

<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}

html,
body{
  width:100%;
  height:100%;
  overflow:hidden;
}

body{
  font-family:'Inter',sans-serif;
  background:#dfe5fb;
}

.phone{
  width:min(100vw,430px);
  height:100dvh;
  min-height:568px;
  margin:0 auto;
  position:relative;
  overflow:hidden;
  background:#f6f8fd url("fondo-tiu.svg") center bottom/cover no-repeat;
  padding:calc(14px + env(safe-area-inset-top)) 16px calc(12px + env(safe-area-inset-bottom));
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:clamp(8px,1.35vh,14px);
}

.header{
  width:100%;
  display:flex;
  align-items:center;
  gap:12px;
  position:relative;
  z-index:5;
  flex:0 0 auto;
}

.back{
  width:42px;
  height:42px;
  border-radius:50%;
  background:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:36px;
  line-height:1;
  color:#ff3333;
  font-weight:700;
  box-shadow:0 4px 14px rgba(42,49,85,.08);
}

.title{
  font-family:'Oswald',sans-serif;
  font-size:clamp(27px,8vw,34px);
  font-weight:700;
  letter-spacing:.2px;
}

.clock{
  width:max-content;
  margin:clamp(6px,1.8vh,16px) auto 0;
  padding:clamp(10px,2.2vh,14px) clamp(30px,10vw,48px);
  border-radius:18px;
  background:#dcd8ff;
  font-size:clamp(38px,12vw,54px);
  line-height:1;
  position:relative;
  z-index:5;
  white-space:nowrap;
}

.date{
  text-align:center;
  font-size:clamp(18px,5vw,24px);
  line-height:1.2;
  color:#4d5a70;
  position:relative;
  z-index:5;
}

.photo{
  width:clamp(104px,31vw,132px);
  height:clamp(104px,31vw,132px);
  border-radius:50%;
  overflow:hidden;
  background:#ddd;
  position:relative;
  z-index:5;
  flex:0 0 auto;
  box-shadow:0 6px 20px rgba(42,49,85,.12);
}

.photo img{
  width:100%;
  height:100%;
  object-fit:cover;
}

/* NUBES */
.cloud{
  position:absolute;
  width:140px;
  height:45px;
  z-index:2;
  opacity:.55;
  animation:moveClouds linear infinite;
}

.cloud::before{
  content:"";
  position:absolute;
  bottom:0;
  width:140px;
  height:24px;
  background:#c2caff;
  border-radius:40px;
}

.cloud::after{
  content:"";
  position:absolute;
  bottom:8px;
  left:42px;
  width:66px;
  height:54px;
  background:#c2caff;
  border-radius:50%;
  box-shadow:
    -45px 17px 0 -12px #c2caff,
    48px 15px 0 -14px #c2caff;
}

.cloud.one{top:49%;animation-duration:20s}
.cloud.two{top:57%;transform:scale(.55);animation-duration:25s;animation-delay:-8s}
.cloud.three{top:43%;transform:scale(.45);animation-duration:28s;animation-delay:-15s}

@keyframes moveClouds{
  from{left:110%}
  to{left:-220px}
}

/* TARJETA */
.card{
  width:100%;
  margin:auto 0 0;
  background:rgba(255,255,255,.91);
  border:1px solid rgba(255,255,255,.72);
  border-radius:18px;
  padding:clamp(18px,3vh,26px) 16px clamp(17px,3vh,24px);
  text-align:center;
  position:relative;
  z-index:4;
  box-shadow:0 8px 24px rgba(42,49,85,.08);
  overflow:hidden;
  flex:0 0 auto;
  backdrop-filter:blur(3px);
}

.demo{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:52px;
  font-weight:900;
  color:rgba(255,0,0,.045);
  transform:rotate(-20deg);
  pointer-events:none;
}

.name{
  font-family:'Oswald',sans-serif;
  font-size:clamp(28px,8.5vw,36px);
  line-height:1.02;
  letter-spacing:1px;
  color:#ff3f3f;
  text-transform:uppercase;
  overflow-wrap:anywhere;
}

.label{
  margin-top:clamp(10px,1.7vh,15px);
  font-size:clamp(14px,4vw,18px);
  line-height:1.15;
  color:#111;
}

.value{
  margin-top:2px;
  font-size:clamp(18px,5.3vw,24px);
  line-height:1.1;
  font-weight:800;
  color:#465266;
}

.career{
  margin-top:clamp(16px,2.4vh,24px);
  font-size:clamp(17px,4.8vw,23px);
  line-height:1.12;
  font-weight:800;
  color:#465266;
}

.campus{
  margin-top:clamp(12px,1.8vh,18px);
  font-size:clamp(16px,4.4vw,21px);
  line-height:1.15;
}

@media(max-height:700px){
  .phone{gap:7px;min-height:0}
  .clock{margin-top:4px}
  .photo{width:100px;height:100px}
  .card{padding:16px 14px 15px}
  .label{margin-top:9px}
  .career{margin-top:14px}
  .campus{margin-top:10px}
}

@media(max-height:610px){
  .back{width:38px;height:38px;font-size:32px}
  .title{font-size:26px}
  .clock{font-size:36px;padding:9px 28px;border-radius:15px}
  .date{font-size:17px}
  .photo{width:82px;height:82px}
  .name{font-size:27px}
  .label{font-size:13px;margin-top:7px}
  .value{font-size:17px}
  .career{font-size:16px;margin-top:11px}
  .campus{font-size:15px;margin-top:8px}
}
</style>
</head>

<body>

<div class="phone">

  <div class="header">
    <div class="back">‹</div>
    <div class="title">TIU VIRTUAL</div>
  </div>

  <div class="clock" id="clock">00:00:00</div>
  <div class="date" id="date">Lunes, 01 Jun 2026</div>

  <div class="photo">
    <img id="studentPhoto" src="foto.jpg" alt="Foto">
  </div>

  <div class="cloud one"></div>
  <div class="cloud two"></div>
  <div class="cloud three"></div>

  <div class="card">
    <div class="demo"></div>

    <div class="name" id="displayName"></div>

    <div class="label">Código de alumno:</div>
    <div class="value" id="studentCode"></div>

    <div class="label">ID Banner:</div>
    <div class="value" id="bannerId"></div>

    <div class="career">ADM. Y GERENCIA DEL EMPREND.</div>
    <div class="campus">📍 Campus San Miguel</div>
  </div>

</div>

<script>
const alumno = {
  nombres:"Eduardo Antonio",
  apellidoPaterno:"Marcos",
  apellidoMaterno:"Serquen",
  codigo:"U202110440",
  banner:"N00981710",
  foto:"foto.jpg"
};

function ocultarApellido(apellido){
  return apellido.charAt(0).toUpperCase() + "***";
}

function ocultarBanner(id){
  return id.slice(0,5) + "***" + id.slice(-1);
}

function cargarDatos(){
  document.getElementById("displayName").innerText =
    `${alumno.nombres} ${ocultarApellido(alumno.apellidoPaterno)} ${ocultarApellido(alumno.apellidoMaterno)}`;

  document.getElementById("studentCode").innerText = alumno.codigo;
  document.getElementById("bannerId").innerText = ocultarBanner(alumno.banner);
  document.getElementById("studentPhoto").src = alumno.foto;
}

function actualizarHora(){
  const ahora = new Date();

  const hora = new Intl.DateTimeFormat("es-PE", {
    timeZone:"America/Lima",
    hour:"2-digit",
    minute:"2-digit",
    second:"2-digit",
    hour12:false
  }).format(ahora);

  const fecha = new Intl.DateTimeFormat("es-PE", {
    timeZone:"America/Lima",
    weekday:"long",
    day:"2-digit",
    month:"short",
    year:"numeric"
  }).format(ahora);

  document.getElementById("clock").innerText = hora;
  document.getElementById("date").innerText =
    fecha.charAt(0).toUpperCase() + fecha.slice(1);
}

cargarDatos();
actualizarHora();
setInterval(actualizarHora,1000);
</script>

</body>
</html>
