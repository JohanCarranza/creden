<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>TIU Virtual Demo</title>

<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}

html,
body{
  width:100%;
  height:100%;
  overflow:hidden;
}

body{
  font-family:'Inter',sans-serif;
  background:#dfe5fb;
}

.phone{
  width:min(100vw,430px);
  height:100dvh;
  min-height:568px;
  margin:0 auto;
  position:relative;
  overflow:hidden;
  background:#f7f9ff url("fondo-tiu.svg") center bottom/cover no-repeat;
  padding:calc(18px + env(safe-area-inset-top)) 18px calc(15px + env(safe-area-inset-bottom));
  display:flex;
  flex-direction:column;
  align-items:center;
}

.header{
  width:100%;
  display:flex;
  align-items:center;
  gap:21px;
  position:relative;
  z-index:7;
  flex:0 0 auto;
}

.back{
  width:40px;
  height:40px;
  border-radius:50%;
  background:white;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#ff1f2b;
  font-size:0;
  box-shadow:0 5px 16px rgba(39,51,91,.08);
}

.back::before{
  content:"";
  width:12px;
  height:12px;
  border-left:5px solid #ff1f2b;
  border-bottom:5px solid #ff1f2b;
  transform:rotate(45deg);
  margin-left:5px;
  border-radius:2px;
}

.title{
  font-family:'Oswald',sans-serif;
  font-size:31px;
  font-weight:700;
  letter-spacing:0;
  line-height:1;
  color:#111318;
}

.clock{
  width:max-content;
  margin-top:clamp(76px,12vh,104px);
  padding:11px 39px 13px;
  border-radius:12px;
  background:#d8d3ff;
  color:#05060a;
  font-size:clamp(43px,13vw,56px);
  font-weight:400;
  line-height:1;
  letter-spacing:0;
  position:relative;
  z-index:7;
  white-space:nowrap;
}

.date{
  margin-top:25px;
  text-align:center;
  font-size:clamp(19px,5vw,24px);
  font-weight:400;
  line-height:1.2;
  color:#46566a;
  position:relative;
  z-index:7;
}

.photo{
  width:clamp(128px,37vw,158px);
  height:clamp(128px,37vw,158px);
  margin-top:clamp(74px,10.5vh,98px);
  border-radius:50%;
  overflow:hidden;
  background:#e3e2ea;
  position:relative;
  z-index:7;
  flex:0 0 auto;
}

.photo img{
  width:100%;
  height:100%;
  object-fit:cover;
}

/* NUBES */
.cloud{
  position:absolute;
  width:140px;
  height:45px;
  z-index:3;
  opacity:.72;
  animation:moveClouds linear infinite;
}

.cloud::before{
  content:"";
  position:absolute;
  bottom:0;
  width:140px;
  height:24px;
  background:#c2caff;
  border-radius:40px;
}

.cloud::after{
  content:"";
  position:absolute;
  bottom:8px;
  left:42px;
  width:66px;
  height:54px;
  background:#c2caff;
  border-radius:50%;
  box-shadow:
    -45px 17px 0 -12px #c2caff,
    48px 15px 0 -14px #c2caff;
}

.cloud.one{top:45%;transform:scale(.48);animation-duration:20s}
.cloud.two{top:52%;transform:scale(.68);animation-duration:25s;animation-delay:-9s}
.cloud.three{top:49%;transform:scale(.38);animation-duration:28s;animation-delay:-16s}

@keyframes moveClouds{
  from{left:110%}
  to{left:-220px}
}

.card{
  width:100%;
  margin:auto 0 0;
  background:rgba(255,255,255,.96);
  border-radius:15px;
  padding:clamp(29px,4.4vh,39px) 18px clamp(28px,4.4vh,40px);
  text-align:center;
  position:relative;
  z-index:6;
  box-shadow:0 8px 24px rgba(42,49,85,.06);
  overflow:hidden;
  flex:0 0 auto;
}

.demo{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:52px;
  font-weight:900;
  color:rgba(255,0,0,.035);
  transform:rotate(-20deg);
  pointer-events:none;
}

.name{
  font-family:'Oswald',sans-serif;
  font-size:clamp(35px,9.8vw,43px);
  line-height:1;
  font-weight:700;
  letter-spacing:1.8px;
  color:#ff3f46;
  text-transform:uppercase;
  overflow-wrap:anywhere;
}

.label{
  margin-top:18px;
  font-size:clamp(17px,4.7vw,22px);
  line-height:1.1;
  font-weight:400;
  color:#111318;
}

.value{
  margin-top:3px;
  font-size:clamp(20px,5.5vw,26px);
  line-height:1.05;
  font-weight:800;
  color:#465266;
}

.career{
  margin-top:32px;
  font-size:clamp(20px,5.5vw,25px);
  line-height:1.12;
  font-weight:800;
  color:#465266;
}

.campus{
  margin-top:21px;
  font-size:clamp(18px,4.7vw,22px);
  line-height:1.15;
  font-weight:400;
  color:#16191f;
}

.pin{
  color:#e53c43;
  margin-right:10px;
}

@media(max-height:760px){
  .clock{margin-top:clamp(48px,8vh,76px)}
  .date{margin-top:18px}
  .photo{margin-top:clamp(46px,8vh,72px);width:120px;height:120px}
  .card{padding:24px 17px 26px}
  .label{margin-top:13px}
  .career{margin-top:23px}
  .campus{margin-top:16px}
}

@media(max-height:650px){
  .phone{padding-top:12px}
  .header{gap:16px}
  .back{width:36px;height:36px}
  .title{font-size:27px}
  .clock{margin-top:30px;font-size:37px;padding:9px 32px;border-radius:11px}
  .date{margin-top:13px;font-size:17px}
  .photo{margin-top:31px;width:94px;height:94px}
  .card{padding:18px 14px 18px;border-radius:14px}
  .name{font-size:28px;letter-spacing:1.2px}
  .label{font-size:14px;margin-top:9px}
  .value{font-size:17px}
  .career{font-size:16px;margin-top:14px}
  .campus{font-size:15px;margin-top:10px}
}
</style>
</head>

<body>

<div class="phone">

  <div class="header">
    <div class="back" aria-hidden="true"></div>
    <div class="title">TIU VIRTUAL</div>
  </div>

  <div class="clock" id="clock">00:00:00</div>
  <div class="date" id="date">Lunes, 01 Jun 2026</div>

  <div class="photo">
    <img id="studentPhoto" src="eduardo.png" alt="Foto de Eduardo">
  </div>

  <div class="cloud one"></div>
  <div class="cloud two"></div>
  <div class="cloud three"></div>

  <div class="card">
    <div class="demo"></div>

    <div class="name" id="displayName"></div>

    <div class="label">Código de alumno:</div>
    <div class="value" id="studentCode"></div>

    <div class="label">ID Banner:</div>
    <div class="value" id="bannerId"></div>

    <div class="career">ADM. Y GERENCIA DEL EMPREND.</div>
    <div class="campus"><span class="pin">📍</span>Campus San Miguel</div>
  </div>

</div>

<script>
const alumno = {
  nombres:"Eduardo Antonio",
  apellidoPaterno:"Marcos",
  apellidoMaterno:"Serquen",
  codigo:"U202110440",
  banner:"N00981710",
  foto:"eduardo.png"
};

function ocultarApellido(apellido){
  return apellido.charAt(0).toUpperCase() + "***";
}

function cargarDatos(){
  document.getElementById("displayName").innerText =
    `${alumno.nombres} ${ocultarApellido(alumno.apellidoPaterno)} ${ocultarApellido(alumno.apellidoMaterno)}`;

  document.getElementById("studentCode").innerText = alumno.codigo;
  document.getElementById("bannerId").innerText = alumno.banner;
  document.getElementById("studentPhoto").src = alumno.foto;
}

function actualizarHora(){
  const ahora = new Date();

  const hora = new Intl.DateTimeFormat("es-PE", {
    timeZone:"America/Lima",
    hour:"2-digit",
    minute:"2-digit",
    second:"2-digit",
    hour12:false
  }).format(ahora);

  const fecha = new Intl.DateTimeFormat("es-PE", {
    timeZone:"America/Lima",
    weekday:"long",
    day:"2-digit",
    month:"short",
    year:"numeric"
  }).format(ahora);

  document.getElementById("clock").innerText = hora;
  document.getElementById("date").innerText =
    fecha.charAt(0).toUpperCase() + fecha.slice(1);
}

cargarDatos();
actualizarHora();
setInterval(actualizarHora,1000);
</script>

</body>
</html>
